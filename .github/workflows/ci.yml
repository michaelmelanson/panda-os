name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      # Every tool (rustc, cargo, qemu, debugfs, imagemagick, python3) comes
      # from the flake's devShell, pinned by flake.lock -- the same toolchain
      # a local `nix develop` gives you. This is deliberate: CI previously
      # installed QEMU via `apt-get install qemu-system-x86` (Ubuntu's
      # packaged build, several major versions behind the Nix-pinned one),
      # which meant a test failure that only reproduced in CI could not be
      # reproduced locally even when matching every other condition (accel
      # mode, parallelism, CPU count) -- the two environments were never
      # running the same software. See docs/TESTING.md "Debugging CI-only
      # test failures" for the investigation this came out of.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # No Nix store cache here: DeterminateSystems/magic-nix-cache-action
      # needs a FlakeHub account (this repo has none) to actually cache
      # anything, so it was only ever emitting an auth warning and doing
      # nothing useful. The devShell's packages (rustc nightly, qemu, etc.)
      # come pre-built from cache.nixos.org, which the Nix installer already
      # trusts by default, so `nix develop` below still fetches binaries
      # rather than building from source -- it just isn't persisted between
      # CI runs. That's an acceptable tradeoff given fetching them fresh
      # each run is a small fraction of total CI time.

      # Put the devShell's toolchain directly on PATH for every later step,
      # instead of prefixing each `run:` with `nix develop -c`. This matters
      # for more than convenience: Swatinem/rust-cache (next step) detects
      # the active Rust toolchain by running `cargo`/`rustc` at the point
      # it's invoked. If it ran before this step, it would find whatever
      # Rust happens to be preinstalled on the runner image -- a different,
      # unrelated toolchain from the pinned nightly one (rust-toolchain.toml)
      # actually used to build -- key the cache on it, and then never get a
      # real hit, silently rebuilding every dependency from scratch on every
      # run. Exporting the real PATH first means rust-cache (and everything
      # after it) sees the actual build toolchain.
      - name: Add Nix devShell to PATH
        run: nix develop --command bash -c 'echo "$PATH"' | tr ':' '\n' >> "$GITHUB_PATH"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"

      - name: Check Cargo.lock is up-to-date
        run: cargo update --workspace --locked

      - name: Build kernel and userspace
        run: make build

      - name: Run unit tests
        run: make unit-test

      - name: Run kernel tests
        env:
          MAX_PARALLEL: 4
          TEST_TIMEOUT: 120
        run: make kernel-test

      - name: Upload kernel test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: kernel-test-logs
          path: build/test-*.log

      - name: Run userspace tests
        env:
          MAX_PARALLEL: 4
          TEST_TIMEOUT: 120
        run: make userspace-test

      - name: Upload userspace test logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: userspace-test-logs
          path: build/utest-*.log
